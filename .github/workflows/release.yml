name: Release

# On a v* tag, publishes to crates.io and creates a matching GitHub release.
#
# Authentication is via crates.io Trusted Publishing (OIDC) — no long-lived
# CRATES_IO_TOKEN secret in the repo. Trust is configured on crates.io's web
# UI per crate (Settings → Trusted Publishers): org=o1-labs, repo=
# mina-archive-sdk-rust, workflow=release.yml.
#
# Prereqs to land before merging this PR:
#   1. Trusted publisher configured on https://crates.io/crates/mina-archive-sdk
#   2. The `eng` (or chosen) GitHub team added as a crate co-owner via
#      `cargo owner --add github:o1-labs:eng mina-archive-sdk`. Lets crate
#      ownership track the org membership instead of a single user.
#
# Until step 1 is done, this workflow will fail at the auth step. The
# CRATES_IO_TOKEN secret can be left in place as an emergency fallback;
# this workflow simply doesn't read it.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # GH release creation
  id-token: write  # OIDC token issuance for crates.io

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release
      - run: cargo test --lib --tests

      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(cargo pkgid | sed -E 's/.*#([^#]+)$/\1/')
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml $pkg"
            exit 1
          fi

      - name: Authenticate with crates.io via OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
