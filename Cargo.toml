[package]
name = "mina-archive-sdk"
version = "2.1.0"
edition = "2021"
# Verified in CI: the crate and its locked dependency graph build and test on
# exactly this toolchain. encoding_rs and the icu_* crates set the floor.
rust-version = "1.88"
license = "Apache-2.0"
description = "Rust SDK for interacting with Mina Archive Node GraphQL endpoints"
repository = "https://github.com/o1-labs/mina-archive-sdk-rust"
homepage = "https://github.com/o1-labs/mina-archive-sdk-rust"
documentation = "https://docs.rs/mina-archive-sdk"
readme = "README.md"
authors = ["O(1) Labs <build@o1labs.org>"]
keywords = ["mina", "blockchain", "graphql", "archive", "zkapp"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
exclude = [".github/", "scripts/", "tests/integration_tests.rs"]

[package.metadata.docs.rs]
# No #[cfg(docsrs)] appears in src/, so only the all-features flag is set.
all-features = true

[features]
default = ["native-tls"]
# TLS for `https://` endpoints, from the system's OpenSSL (or the platform's
# TLS library on macOS and Windows).
native-tls = ["reqwest/default-tls"]
# TLS from rustls with the Mozilla root certificates: no OpenSSL to build or
# link. Use with `default-features = false`.
rustls-tls = ["reqwest/rustls-tls"]

[dependencies]
# reqwest's default features without its TLS: the features above choose it
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
